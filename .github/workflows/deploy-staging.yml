name: Deploy Foodlab Staging

# Dipicu SETELAH build image selesai, bukan oleh push. Sebelumnya keduanya
# dipicu push yang sama: deploy selesai ~12 detik sementara build butuh ~3
# menit, sehingga `docker compose pull` di server mengambil image dari build
# SEBELUMNYA. Tidak terlihat untuk perubahan kode PHP (kode datang dari git
# pull), tapi salah ketika docker/php/Dockerfile berubah.
#
# Catatan: workflow_run hanya dibaca dari definisi di default branch.
on:
  workflow_run:
    workflows: ["Build & Push (staging)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodlab-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Jangan deploy kalau build-nya gagal — image untuk commit ini tidak ada.
    # Cek head_branch supaya build dari branch lain tidak ikut men-deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'staging')

    # Tidak ada actions/checkout: job ini hanya membuka SSH ke server, dan
    # server melakukan git pull sendiri. Checkout hanya menambah waktu dan
    # memunculkan warning git exit 128 saat membersihkan kredensial.
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_foodlab_key
          chmod 600 ~/.ssh/oracle_foodlab_key
          ssh-keyscan -p "${{ secrets.ORACLE_SSH_PORT }}" -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh \
            -i ~/.ssh/oracle_foodlab_key \
            -p "${{ secrets.ORACLE_SSH_PORT }}" \
            "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" \
            "/opt/stacks/foodlab/deploy-staging.sh"