name: ci

on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46      # match versi host (8.0.46-0ubuntu0.22.04.4)
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root          # root dibutuhkan utk migrate trigger (butuh SUPER privilege)
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'      # match runtime produksi (php:7.4-fpm-bullseye)
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan config:clear
      # Buat skema DB testing sebelum test (service mysql kosong)
      - run: php artisan migrate --env=testing --force
      # Jalankan SELURUH test suite. Tidak ada daftar path yang di-maintain manual,
      # jadi test baru otomatis ikut terjaga oleh gerbang ini.
      - run: php artisan test --env=testing
