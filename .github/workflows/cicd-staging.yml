name: Build & Push (staging)

on:
  push:
    branches: ["staging"]

jobs:
  docker:
    # Server staging (Oracle Ampere) berarsitektur arm64. Runner arm native
    # dipakai supaya image yang dibangun cocok dengan server tanpa emulasi QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Image runtime yang dipakai server staging (php-fpm + ekstensi).
          # Bukan Dockerfile di root repo — itu image lama yang menyalin kode
          # ke dalam image, sedangkan server memasang kode lewat bind-mount.
          file: docker/php/Dockerfile
          push: true
          tags: |
            foodlab/backend_masbrocanteen:staging
            foodlab/backend_masbrocanteen:staging-${{ github.sha }}

      # Salin image yang barusan dipush ke GHCR di level manifest (tanpa rebuild),
      # supaya digest-nya identik dengan image yang sudah lolos CI.
      - name: Mirror image to GHCR
        env:
          SRC: docker.io/foodlab/backend_masbrocanteen
          DST: ghcr.io/foodlabdev/backend_masbrocanteen
          SHA_TAG: staging-${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$DST:$SHA_TAG" \
            --tag "$DST:staging" \
            "$SRC:$SHA_TAG"

      # Deploy dipicu dari sini, bukan dari push ke staging. Kalau Komodo dipicu
      # push, deploy jalan bersamaan dengan build (~3 menit) sehingga
      # `docker compose pull` di server bisa menarik image build sebelumnya.
      #
      # Komodo memakai listener bergaya GitHub, jadi request harus membawa
      # tanda tangan HMAC-SHA256 dari body memakai webhook secret.
      - name: Trigger deploy Komodo
        env:
          KOMODO_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          for v in KOMODO_URL KOMODO_SECRET; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v kosong"
              exit 1
            fi
          done

          # Ref ini hanya untuk lolos pemeriksaan branch listener Komodo, yang
          # mencocokkannya dengan segmen terakhir URL webhook (/main). Bukan
          # penentu apa yang di-deploy: deploy-staging.sh selalu menarik branch
          # staging. Kalau URL webhook diganti, samakan nilai ini.
          BODY='{"ref":"refs/heads/main"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$KOMODO_SECRET" | awk '{print $NF}')

          CODE=$(curl -sS --max-time 30 -o /tmp/komodo.out -w '%{http_code}' -X POST "$KOMODO_URL" -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' -H "X-Hub-Signature-256: sha256=$SIG" --data "$BODY")

          echo "HTTP $CODE"
          cat /tmp/komodo.out || true
          echo

          if [ "$CODE" -ge 400 ]; then
            echo "::error::Komodo menolak webhook (HTTP $CODE)"
            exit 1
          fi

          echo "Webhook terkirim. Jalannya deploy dipantau di Komodo, bukan di sini."

