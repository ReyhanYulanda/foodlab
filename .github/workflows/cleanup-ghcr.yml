name: Cleanup GHCR

# Hanya manual. Trigger `schedule:` sengaja TIDAK dipakai: GitHub hanya
# menjalankan schedule dari default branch (main), dan main tidak punya folder
# .github/workflows — jadwalnya tidak akan pernah menyala. Pruning otomatis
# ditangani job `prune` di cicd-staging.yml yang dipicu push.
#
# Workflow ini disimpan sebagai jaring pengaman untuk pruning di luar jadwal
# build, misalnya saat kuota mendekati batas.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'Jumlah versi terbaru yang dipertahankan'
        required: true
        default: '5'

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          owner: foodlabdev
          package-name: backend_masbrocanteen
          package-type: container
          min-versions-to-keep: ${{ inputs.keep }}
